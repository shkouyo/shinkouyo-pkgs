name: remove-one

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name without .sh
        required: true
        type: string
      confirm:
        description: Type DELETE to confirm removal
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PACKAGE: ${{ github.event.inputs.package }}
      CONFIRM: ${{ github.event.inputs.confirm }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate input
        run: |
          set -eu
          test "$CONFIRM" = "DELETE"
          . scripts/lib/common.sh
          require_package_name "$PACKAGE"

  remove:
    needs: validate
    uses: ./.github/workflows/_remove-package.yml
    with:
      package: ${{ github.event.inputs.package }}
    secrets: inherit
